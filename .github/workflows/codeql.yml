name: "CodeQL Analysis"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Scan (Java & Kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Set up JDK 17 (Required by Kotlin 2.x and AGP)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Set up Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 3. Grant execute permission for gradlew
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # 4. Initialize CodeQL with manual build mode
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # 5. Build Android App explicitly (replaces failing autobuild.sh)
      - name: Build Android App for CodeQL Analysis
        run: |
          ./gradlew assembleDebug --no-daemon

      # 6. Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
